<!DOCTYPE html>
<!-- ============================= -->
<!-- PORTFOLIO PROJECT: MENU RANDOMIZER -->
<!-- Tech: HTML5 + Bootstrap + CSS + JS -->
<!-- Objetivo: Aprender estructura real web -->
<!-- ============================= -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Responsive para móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Menu Randomizer</title>

    <!-- ============================= -->
    <!-- BOOTSTRAP (framework visual) -->
    <!-- Nos da grid, botones y estilos -->
    <!-- ============================= -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4efe9);
            min-height: 100vh;
        }


        h1 {
            font-weight: 600;
        }


        /* Tarjetas de cada día */
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s;
        }


        .card:hover {
            transform: scale(1.02);
        }


        .day-title {
            font-weight: 600;
            font-size: 1.1rem;
        }


        .meal {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 10px;
            margin-top: 5px;
            font-size: 0.95rem;
        }


        .btn-main {
            border-radius: 50px;
            padding: 12px 25px;
            font-weight: 600;
        }


        footer {
            margin-top: 40px;
            opacity: 0.6;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
<!-- ============================= -->
<!-- CONTENEDOR PRINCIPAL -->
<!-- Bootstrap container centra todo -->
<!-- ============================= -->
<div class="container py-5">


<!-- HEADER -->
<div class="text-center mb-5">
<h1>🍽️ Weekly Menu Randomizer</h1>
<p class="text-muted">Genera automáticamente tu menú semanal sin repeticiones</p>


<!-- BOTÓN PRINCIPAL -->
<!-- onclick llama a función JS -->
<button class="btn btn-success btn-main mt-3" onclick="generateMenu()">
Generar menú
</button>
</div>


<!-- AQUÍ JS INSERTA LAS TARJETAS -->
<div class="row" id="menuContainer"></div>


<footer class="text-center">
Creado por Lisandro H. G. Mosconi Fariña • Portfolio Project
</footer>
</div>

<!-- ============================= -->
<!-- JAVASCRIPT -->
<!-- Aquí vive la lógica -->
<!-- ============================= -->
<script>


// =============================
// ARRAY DE COMIDAS
// =============================
const meals = [
"Pollo con arroz",
"Ensalada César (o cualquier otra)",
"Pasta boloñesa",
"Poke",
"Tortilla de patatas",
"Ramen",
"Hamburguesas",
"Pizza",
"Milanesas",
"Lentejas",
"Arroz con curry",
"Fajitas",
"Crema de verduras",
"Sandwiches",
"Ensalada de pasta",
"Empanadas",
"Pitas Reina Pepiada",
"Risotto",
"Comida china",
"Burritos",
"Bocata",
"Pasta carbonara",
"Sobras",
"Limpiar despensa y congelador",
"Sopa con verduras",
"Perritos calientes",
"Lasaña",
"Okonomiyaki"
];


// Días de la semana
const days = [
"Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"
];


// =============================
// FUNCIÓN SHUFFLE
// Mezcla array aleatoriamente
// Algoritmo Fisher-Yates
// =============================
function shuffle(array) {
for (let i = array.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[array[i], array[j]] = [array[j], array[i]];
}
return array;
}


// =============================
// FUNCIÓN PRINCIPAL
// Genera menú sin repetir
// =============================
function generateMenu() {


const container = document.getElementById("menuContainer");
container.innerHTML = ""; // limpia menú anterior


// Necesitamos 14 platos únicos
if (meals.length < 14) {
alert("Necesitas mínimo 14 comidas diferentes");
return;
}


// Copia y mezcla comidas
let shuffledMeals = shuffle([...meals]);


// Recorremos días
days.forEach((day, index) => {


// 2 platos por día
const meal = shuffledMeals[index * 2];
const dinner = shuffledMeals[index * 2 + 1];


// Crear columna bootstrap
const col = document.createElement("div");
col.className = "col-md-6 col-lg-4 mb-4";
// HTML interno de la tarjeta
col.innerHTML = `
  <div class="card p-3 h-100">
    <div class="day-title">${day}</div>
    <div class="meal">🍛 Comida: <strong>${meal}</strong></div>
    <div class="meal">🌙 Cena: <strong>${dinner}</strong></div>
  </div>
`;
container.appendChild(col);
}); 
} 
</script>
</script>

<!-- Bootstrap JS (animaciones etc) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
